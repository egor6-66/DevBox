name: Проверки

# Образ проверяется ЗДЕСЬ, а не на машине человека: для сборки нужен docker, а скоуп разработки
# сам живёт в контейнере.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать образ
        run: docker build -t devbox:dev .

      # Сами проверки — в файле: его же гоняют локально перед Rebuild тестового окна.
      - name: Проверить образ
        run: sh test/image.sh devbox:dev
