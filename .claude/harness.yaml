# harness.yaml — данные роль-модели этого репозитория: КТО чем владеет и на какой модели
# работает. Сама роль-модель (роли, опознание сессии, гейт git-записи) приезжает плагином
# `harness`; здесь только данные, потому что зоны у каждого репозитория свои.
apiVersion: harness/v1
kind: harness

product: devbox

# Число архитекторов (main-сессий).
architects: 1

# Пины моделей по роли. Берём АЛИАСЫ, а не снапшоты с датой: алиас едет за выпусками сам.
models:
  architect: claude-opus-5
  owner: claude-opus-5
  layer: claude-haiku-4-5

# ЗОНЫ пока не выделены: репозиторий ведёт архитектор целиком. Появятся зоны — вписать сюда и
# породить файлы ролей: node <плагин>/scripts/generate-roles.mjs .
zones: {}
