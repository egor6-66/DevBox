# Инструменты скоупа — конфиг mise (https://mise.jdx.dev). Имена — из реестра: `mise registry`.
# Ставятся при создании контейнера; руками — `mise install`.

[tools]
# Репозитории скоупа клонирует mani по mani.yaml — без него они не появятся.
mani = "latest"
gh = "latest"
claude = "latest"
# Секреты: fnox шифрует ключом age (см. README девбокса, «Первая настройка на новой машине»).
fnox = "latest"
age = "latest"
# pnpm в образе уже есть. Если ваши репозитории закрепили свою версию (`packageManager` в
# package.json), назовите здесь ту же — точным номером: тогда все команды скоупа идут одним pnpm.
# pnpm = "11.17.0"
