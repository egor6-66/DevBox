# Линки приложений на локальные пакеты соседних репозиториев. Применяется только командой:
#   devbox link [приложение]     devbox unlink [приложение]
#
# По умолчанию приложение берёт пакеты из реестра. Линк — временный, на время правки пакета.
#
# приложение:            куда
#   сосед:               откуда
#     - пакет            что: имя пакета, его хвост после `/` или имя папки
#   сосед: all           все пакеты соседа, которые приложение использует
#
# my-app:
#   my-lib: all
