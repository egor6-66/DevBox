# Репозитории скоупа — конфиг mani (https://manicli.com). Клонируются при подключении редактора;
# руками — `mani sync --sync-remotes`.
#
# Пути считаются от этой папки, поэтому каждый репозиторий лежит уровнем выше: `../имя`.
# Адреса (`remotes`) приводятся к этому файлу: названное здесь ставится, поставленное руками мимо
# него — убирается.
#
# После правки добавьте папку репозитория в `tree.code-workspace`, чтобы она появилась в окне.
#
# projects:
#   my-app:
#     url: https://github.com/me/my-app.git
#     path: ../my-app
#     tags: [app]
#     remotes:
#       work: https://git.example.com/team/my-app

projects: {}
